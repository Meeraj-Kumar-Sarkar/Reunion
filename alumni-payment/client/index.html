<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Optimize Font Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Primary SEO Meta Tags -->
    <title>AlumniFund — Support Our Legacy | Zero-Fee UPI Payments</title>
    <meta
      name="title"
      content="AlumniFund — Support Our Legacy | Zero-Fee UPI Payments"
    />
    <meta
      name="description"
      content="Join hands with fellow alumni to empower the next generation. Make secure, zero-fee UPI contributions to our alumni fund and help build a stronger future for our community."
    />
    <meta
      name="keywords"
      content="alumni fund, alumni donation, UPI payment, reunion contribution, alumni portal, support alumni"
    />
    <meta name="author" content="AlumniFund" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AlumniFund — Support Our Legacy" />
    <meta
      property="og:description"
      content="Make secure, zero-fee UPI contributions to our alumni fund and help build a stronger future for our community."
    />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AlumniFund — Support Our Legacy" />
    <meta
      name="twitter:description"
      content="Make secure, zero-fee UPI contributions and help build a stronger future for our alumni community."
    />

    <!-- Mobile & Theme -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
